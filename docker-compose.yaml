# =============================================================================
# Synapse — Docker Compose
# =============================================================================
#
# Services:
#   db  — PostgreSQL database (reuses the existing synapse-db image)
#   api — Synapse REST API server
#
# Usage:
#   docker compose up -d          # start everything
#   docker compose down           # stop everything
#   docker compose logs -f api    # tail API logs
#
# After startup:
#   API:        http://localhost:8080
#   Swagger UI: http://localhost:8080/docs
# =============================================================================

services:
  db:
    build:
      context: pkg/storage/docker
    container_name: synapse-db
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - synapse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  nats:
    image: nats:2-alpine
    container_name: synapse-nats
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - synapse-natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  synapse-pgdata:
  synapse-natsdata:
